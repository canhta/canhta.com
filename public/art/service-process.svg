  .approve { animation: approve 4.8s ease-in-out 1; transform-box: fill-box; transform-origin: center; }
  .scan { animation: scan 4.8s ease-in-out 1; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes flow { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes approve { 0%,65%,100% { transform: scale(1); opacity: 1; } 78% { transform: scale(1.06); opacity: .8; } }
  @keyframes scan { 0%,100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(86px); opacity: 1; } }
}
</style>
